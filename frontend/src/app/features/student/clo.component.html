<app-page-header title="Mức độ đạt chuẩn đầu ra CLO" subtitle="Kết quả được tổng hợp từ các thành phần đánh giá bằng MongoDB Aggregation."></app-page-header><section class="clo-grid">@for(c of items();track c.courseCode+c.cloCode){<article class="panel clo-card"><div class="clo-heading"><div><span>{{c.courseCode}} · {{c.courseName}}</span><h3>{{c.cloCode}}</h3></div><span class="badge" [class.success]="c.passed" [class.danger]="!c.passed">{{c.passed?'Đạt':'Chưa đạt'}}</span></div><p>{{c.description}}</p><div class="progress-label"><span>Mức độ đạt</span><b>{{c.percentage}}%</b></div><div class="progress"><i [style.width.%]="c.percentage"></i><em [style.left.%]="c.threshold"></em></div><small>Ngưỡng đạt: {{c.threshold}}% · Thành phần: {{c.contributingComponents.join(', ')}}</small></article>}</section>
