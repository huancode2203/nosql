services:
  mongo:
    image: mongo:7.0
    container_name: edumanage-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-lms_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-LmsMongo@123}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-EduManageLms}
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok", "mongodb://localhost:27017/admin"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: ./backend/EduManageLms.Api
    container_name: edumanage-api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      MongoDb__ConnectionString: mongodb://${MONGO_ROOT_USERNAME:-lms_admin}:${MONGO_ROOT_PASSWORD:-LmsMongo@123}@mongo:27017/?authSource=admin
      MongoDb__DatabaseName: ${MONGO_DATABASE:-EduManageLms}
      Jwt__Key: ${JWT_KEY:-DEVELOPMENT_ONLY_CHANGE_TO_AT_LEAST_32_CHARACTERS}
      Jwt__Issuer: ${JWT_ISSUER:-EduManageLms}
      Jwt__Audience: ${JWT_AUDIENCE:-EduManageLms.Client}
      Backup__Directory: /app/backups
    ports: ["8080:8080"]
    volumes: ["backup_data:/app/backups"]
    depends_on:
      mongo: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
  frontend:
    build: ./frontend
    container_name: edumanage-frontend
    restart: unless-stopped
    ports: ["8081:80"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  mongo_data:
  backup_data:
